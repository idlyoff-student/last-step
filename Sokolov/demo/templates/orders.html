{% extends "base.html" %}{% block content %}<div class="pagehead">
    <h1>Заказы</h1><a class="button" href="/orders/new">+ Новый заказ</a>
</div>
<section class="panel">
    <table>
        <tr>
            <th>№</th>
            <th>Клиент</th>
            <th>Дата</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th></th>
        </tr>{% for o in orders %}<tr>
            <td>#{{o.id}}</td>
            <td>{{o.customer_name}}</td>
            <td>{{o.created_at}}</td>
            <td>{{"%.2f"|format(o.total)}} ₽</td>
            <td>
                <form method="post" action="/orders/{{o.id}}/status"><select name="status"
                        onchange="this.form.submit()">{% for s in ["Новый","Готовится","Готов"] %}<option {{'selected'
                            if o.status==s}}>{{s}}</option>{% endfor %}</select></form>
            </td>
            <td><a href="/orders/{{o.id}}">Открыть</a></td>
        </tr>{% endfor %}
    </table>
</section>{% endblock %}
