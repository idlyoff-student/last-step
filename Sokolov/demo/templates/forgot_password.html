{% extends "base.html" %}{% block title %}Восстановление{% endblock %}{% block content %}<div class="auth">
    <h1>Восстановление пароля</h1>{% if not question %}<form method="post" class="form"><label>Логин<input
                name="username" required></label><button class="button">Продолжить</button></form>{% else %}<p
        class="question">{{question}}</p>
    <form method="post" class="form"><input type="hidden" name="action" value="reset"><input type="hidden"
            name="username" value="{{username}}"><label>Ответ<input name="answer" required></label><label>Новый
            пароль<input name="new_password" type="password" minlength="6" required></label><button
            class="button">Изменить пароль</button></form>{% endif %}<a href="/login" class="under">Вернуться ко
        входу</a>
</div>{% endblock %}
